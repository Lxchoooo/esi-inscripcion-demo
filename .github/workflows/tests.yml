name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Tests de logica
        run: node tests/esi-tests.js src
      - name: Smoke de interfaz
        run: node tests/ui-smoke.js src
      - name: Copia publicada
        run: cmp src/Panel.html index.html
