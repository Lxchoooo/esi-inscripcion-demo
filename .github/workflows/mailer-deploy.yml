name: mailer-deploy

# Publica los .gs del robot (tools/mailer/*.gs) en el proyecto de Apps Script
# de esi@ usando la Apps Script API. No hay que abrir el editor ni copiar/pegar.
# Configuración por única vez: ver tools/mailer/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'tools/mailer/*.gs'
      - 'scripts/deploy-mailer-api.sh'
      - '.github/workflows/mailer-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailer-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: ¿Está configurado?
        id: cfg
        env:
          TOKEN: ${{ secrets.ESI_REFRESH_TOKEN }}
          SCRIPT: ${{ vars.ESI_SCRIPT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$SCRIPT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta ESI_REFRESH_TOKEN (secret) o ESI_SCRIPT_ID (variable). Pasos en tools/mailer/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Actualizar el robot en esi@
        if: steps.cfg.outputs.ready == 'true'
        env:
          ESI_REFRESH_TOKEN: ${{ secrets.ESI_REFRESH_TOKEN }}
          ESI_SCRIPT_ID: ${{ vars.ESI_SCRIPT_ID }}
        run: sh scripts/deploy-mailer-api.sh
